<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人备忘录</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Auth Section -->
        <div id="auth" class="card auth-card hidden">
            <h1 class="brand">多人备忘录</h1>
            <div class="tabs">
                <button class="tab active" data-tab="login">登录</button>
                <button class="tab" data-tab="register">注册</button>
            </div>
            <form id="form-login" class="form active">
                <input type="email" id="login-email" class="input" placeholder="邮箱" required autocomplete="email">
                <input type="password" id="login-pass" class="input" placeholder="密码" required autocomplete="current-password">
                <button type="submit" class="btn btn-full">登录</button>
            </form>
            <form id="form-register" class="form">
                <input type="email" id="reg-email" class="input" placeholder="邮箱" required autocomplete="email">
                <input type="password" id="reg-pass" class="input" placeholder="密码 (至少6位)" required minlength="6" autocomplete="new-password">
                <button type="submit" class="btn btn-full">注册</button>
            </form>
            <p id="auth-msg" class="msg"></p>
        </div>

        <!-- App Section -->
        <div id="app" class="hidden">
            <header class="header">
                <h1 class="brand">多人备忘录</h1>
                <span id="user-email" class="user-tag"></span>
                <button id="btn-logout" class="btn secondary">退出</button>
            </header>

            <div class="main-grid">
                <!-- Create Note -->
                <section class="card">
                    <h2 id="editor-title">新建备忘录</h2>
                    <input type="text" id="note-title" class="input mb-2" placeholder="标题">
                    <textarea id="note-content" class="input" rows="4" placeholder="内容..."></textarea>
                    <div class="flex justify-between items-center mt-2">
                        <button id="btn-save" class="btn">保存</button>
                        <button id="btn-cancel-edit" class="btn secondary hidden">取消</button>
                    </div>
                    <p id="note-msg" class="msg"></p>
                </section>

                <!-- Notes List -->
                <section class="card">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="mb-0">备忘录列表</h2>
                        <button id="btn-refresh" class="btn secondary">刷新</button>
                    </div>
                    <ul id="notes-list" class="notes-list"></ul>
                    <p id="list-msg" class="msg"></p>
                </section>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
